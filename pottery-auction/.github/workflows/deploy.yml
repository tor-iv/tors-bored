# Deploy to Hetzner on push to main.
# Configure these repository secrets in Settings → Secrets and variables → Actions:
#   HETZNER_IP           — public IPv4 of the server
#   SSH_PRIVATE_KEY      — private key whose public half is in the server's authorized_keys
#   SSH_HOST_FINGERPRINT — SHA256 host key fingerprint (ssh-keyscan + ssh-keygen -lf)

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            cd /opt/tors-bored
            git pull origin main
            docker compose up -d --build
            # Caddy's config is bind-mounted, so `up -d` won't pick up Caddyfile
            # edits. `caddy reload` over the admin API proved unreliable, so
            # restart the container to reload the config (certs are cached in the
            # caddy_data volume, so this won't re-issue on every deploy).
            docker compose restart caddy
            docker image prune -f
