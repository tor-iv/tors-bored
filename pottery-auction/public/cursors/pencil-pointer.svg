<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Pencil body, tip slightly right for pointer hotspot ~(12,28) -->
  <g transform="rotate(-15, 16, 16)">
    <!-- Eraser cap -->
    <rect x="13" y="3" width="6" height="4" rx="1" fill="#d9c4a0" stroke="#1b1211" stroke-width="1.2"/>
    <!-- Metal ferrule -->
    <rect x="13" y="7" width="6" height="2.5" fill="#a89070" stroke="#1b1211" stroke-width="0.8"/>
    <!-- Body -->
    <rect x="13" y="9.5" width="6" height="13" fill="#f5e88a" stroke="#1b1211" stroke-width="1.2"/>
    <!-- Tip taper -->
    <path d="M13 22.5L16 28.5L19 22.5Z" fill="#f5d080" stroke="#1b1211" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Graphite tip -->
    <path d="M15 27L16 28.5L17 27Z" fill="#1b1211"/>
  </g>
</svg>
